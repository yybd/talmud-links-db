# בדיקה חד-פעמית: האם ל-runner יש מקום לבנות את הגרף.
#
# הבנייה דורשת שיא של ~9.7GB בו-זמנית — seforim.db.zst של אוצריא
# (1.43GB) שנפרס ל-7.9GB, ומהם נגזר links.db. המספרים שבתיעוד של
# GitHub סותרים את מה שהמכונה מדווחת בפועל, ולכן מודדים.
name: disk-probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: מקום פנוי לפני
        run: |
          echo "── df -h ──"; df -h / /mnt 2>/dev/null || df -h /
          echo "── מה תופס מקום ──"; du -sh /usr/local/lib/android /opt/ghc /usr/share/dotnet 2>/dev/null || true

      - name: הורדת הנכס של אוצריא
        run: |
          cd "${RUNNER_TEMP}"
          time curl -sL -o seforim.db.zst \
            https://github.com/Otzaria/SeforimLibrary/releases/latest/download/seforim.db.zst
          ls -lh seforim.db.zst

      - name: פריסה ומדידה
        run: |
          cd "${RUNNER_TEMP}"
          sudo apt-get install -y -qq zstd >/dev/null
          time zstd -d seforim.db.zst -o seforim.db
          ls -lh seforim.db
          echo "── מקום פנוי בשיא ──"; df -h "${RUNNER_TEMP}"

      - name: המסד אכן קריא
        run: |
          sudo apt-get install -y -qq sqlite3 >/dev/null
          sqlite3 "file:${RUNNER_TEMP}/seforim.db?immutable=1" \
            "SELECT 'db_version=' || value FROM schema_meta WHERE key='db_version';
             SELECT 'books=' || COUNT(*) FROM book;"
